name = "glint"
defaultTargets = ["glint"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "paw"
git = "https://github.com/katzenpost/paw.git"
rev = "02c5a01930b0fb776e88232c301dc9a618ca0e3f"

[[require]]
name = "Logger"
git = "https://github.com/katzenpost/Logger.git"
rev = "61f4fc02ffa00401d59d98f25feda499f26b10e2"

[[require]]
name = "thinclient"
git = "https://github.com/katzenpost/thin_client.git"
rev = "cbc2272c156bbe67cbc6b996677811baff3eb404"

[[require]]
name = "lean_unix_socket"
git = "https://github.com/katzenpost/lean_unix_socket.git"
rev = "4bbfd6bb9df6bc9ce0d31252afff86d48683c9f2"

[[require]]
name = "group_chat_client"
git = "https://github.com/katzenpost/group_chat_client.git"
rev = "4a1e73e6a0d04b7dcd43e53b7e4a4a3f4ebd88da"

[[require]]
name = "rustic_audio_lean"
git = "https://github.com/katzenpost/rustic_audio_lean.git"
rev = "18d4ca2e7c3b1eea0a97195d158638c00ed6aa60"

# Last, so that its pin wins over the older ones its dependents carry.
[[require]]
name = "cryptlib"
git = "https://github.com/katzenpost/cryptlib.git"
rev = "6f651738d26db5ac18dd5670bf501cfc63723175"

[[lean_lib]]
name = "Glint"

[[lean_exe]]
name = "glint"
root = "Glint.Main"
moreLinkArgs = ["-Wl,--allow-shlib-undefined", "/usr/lib/x86_64-linux-gnu/libasound.so.2"]

[[lean_exe]]
name = "glint-test"
root = "Glint.Tests.Main"
moreLinkArgs = ["-Wl,--allow-shlib-undefined", "/usr/lib/x86_64-linux-gnu/libasound.so.2"]
