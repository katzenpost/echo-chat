name = "frank_chat"
version = "0.2.0"
description = "A desktop group chat over the Katzenpost mixnet, in Lean, on Paw and cryptlib"
keywords = ["chat", "gui", "mixnet", "katzenpost", "privacy"]
license = "AGPL-3.0-only"
defaultTargets = ["frank_chat"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "paw"
git = "https://github.com/katzenpost/paw.git"
rev = "bb4452bd284ed14d9d559451878fda7ed8cf94d7"

[[require]]
name = "Logger"
git = "https://github.com/katzenpost/Logger.git"
rev = "f278d2cf58d60b9732dd643807f38f3f635f4f57"

[[require]]
name = "thinclient"
git = "https://github.com/katzenpost/thin_client.git"
rev = "cbc2272c156bbe67cbc6b996677811baff3eb404"

[[require]]
name = "lean_unix_socket"
git = "https://github.com/katzenpost/lean_unix_socket.git"
rev = "daf2480b1183b3007eaf9ecebb6de323d3785b75"

[[require]]
name = "group_chat_client"
git = "https://github.com/katzenpost/group_chat_client.git"
rev = "dc8313491957774aaefe0eaffe40fcbd1d7b514a"

[[require]]
name = "rustic_audio_lean"
git = "https://github.com/katzenpost/rustic_audio_lean.git"
rev = "63fced24fadc43b118c175f8892563a4f52c7cc0"

# Last, so that its pin wins over the older ones its dependents carry.
[[require]]
name = "cryptlib"
git = "https://github.com/katzenpost/cryptlib.git"
rev = "6f651738d26db5ac18dd5670bf501cfc63723175"

[[lean_lib]]
name = "FrankChat"

[[lean_exe]]
name = "frank_chat"
root = "FrankChat.Main"
moreLinkArgs = ["-Wl,--allow-shlib-undefined", "/usr/lib/x86_64-linux-gnu/libasound.so.2"]

[[lean_exe]]
name = "frank_chat_test"
root = "FrankChat.Tests.Main"
moreLinkArgs = ["-Wl,--allow-shlib-undefined", "/usr/lib/x86_64-linux-gnu/libasound.so.2"]
