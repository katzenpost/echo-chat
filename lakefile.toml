name = "glint"
defaultTargets = ["glint"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "paw"
git = "https://github.com/katzenpost/paw.git"
rev = "e1bf10d4a930f2768cb71f4ff25aace5db906ab6"

[[require]]
name = "Logger"
git = "https://github.com/katzenpost/Logger.git"
rev = "61f4fc02ffa00401d59d98f25feda499f26b10e2"

[[require]]
name = "thinclient"
git = "https://github.com/katzenpost/thin_client.git"
rev = "5e96c63e95a99db2e9a74e44c09cb8a0b31c5619"

[[require]]
name = "lean_unix_socket"
git = "https://github.com/katzenpost/lean_unix_socket.git"
rev = "4bbfd6bb9df6bc9ce0d31252afff86d48683c9f2"

# Last, so that its pin wins over the older ones its dependents carry.
[[require]]
name = "CryptWalker"
git = "https://github.com/katzenpost/CryptWalker.git"
rev = "6e83bc855e46b6b6a6ec2f8916ce48039f51191a"

[[lean_lib]]
name = "Glint"

[[lean_exe]]
name = "glint"
root = "Glint.Main"

[[lean_exe]]
name = "glint-test"
root = "Glint.Tests.Main"
